    <circle cx="939" cy="477" r="81" fill="#4338ca" opacity="0.09"/>
    <circle cx="859" cy="-77" r="76" fill="#4338ca" opacity="0.09"/>
    <circle cx="231" cy="328" r="84" fill="#4338ca" opacity="0.08"/>
    <circle cx="271" cy="214" r="68" fill="#4338ca" opacity="0.19"/>
    <rect x="133" y="707" width="97" height="61" rx="8" fill="#4f46e5" opacity="0.04" transform="rotate(29, -90, 310)"/>
    <rect x="831" y="155" width="98" height="63" rx="8" fill="#4f46e5" opacity="0.13" transform="rotate(33, 227, 609)"/>
    <rect x="920" y="405" width="60" height="90" rx="8" fill="#4f46e5" opacity="0.10" transform="rotate(38, 279, 661)"/>
    <rect x="895" y="537" width="44" height="46" rx="8" fill="#4f46e5" opacity="0.15" transform="rotate(41, 1147, 572)"/>
    <rect x="156" y="341" width="70" height="98" rx="8" fill="#4f46e5" opacity="0.09" transform="rotate(0, 676, 599)"/>
    <rect x="1284" y="128" width="61" height="89" rx="8" fill="#4f46e5" opacity="0.08" transform="rotate(11, 949, 591)"/>
    <rect x="775" y="-7" width="24" height="60" rx="8" fill="#4f46e5" opacity="0.12" transform="rotate(9, 1058, 154)"/>
    <rect x="1224" y="386" width="54" height="62" rx="8" fill="#4f46e5" opacity="0.11" transform="rotate(13, 902, 234)"/>
    <polygon points="230,215 321,397 139,397" fill="#4338ca" opacity="0.07"/>
    <polygon points="873,383 929,495 817,495" fill="#4338ca" opacity="0.12"/>
    <polygon points="500,350 527,404 473,404" fill="#4338ca" opacity="0.04"/>
    <polygon points="1299,442 1351,546 1247,546" fill="#4338ca" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,534 C360,582 840,486 1200,534 L1200,630 L0,630Z" fill="#4338ca" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    대구 SEO 마케팅 업체
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    대구 — SEO 마케팅
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#818cf8" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
